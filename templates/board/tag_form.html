{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
    <h1 class="heading">
        {% if tag %}Update{% else %}New{% endif %} label
    </h1>

    <div class="content">
        <form action="" method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <input type="submit" value="Submit" class="btn button-primary">
        </form>
    </div>
{% endblock %}
