{% extends "base.html" %}

{% block content %}
    <h1 class="heading">
        Delete label: <u>{{ tag.name }}</u>
    </h1>

    <div class="content">
        <h5>
            Are you sure you want to delete this label?
        </h5>

        <h2>
            
        </h2>

        <form action="" method="post">
            {% csrf_token %}
            <input type="submit" value="Delete" class="btn button-primary">
            <a class="btn button-secondary" href="{% url 'board:tag-list' %}">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}
