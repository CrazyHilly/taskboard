{% extends "base.html" %}

{% block content %}
    <h1 class="task-detail-heading">
        Labels
    </h1>

    <div class="ml-4">
        <a href="{% url "board:tag-create" %}" class="btn button">
            Add label
        </a>
    </div>

    <table class="col-6 tag-table content">
        {% for tag in tag_list %}
            <tr class="tag-row">
                <td>
                    <span class="empty tag-{{ tag.color }}">
                        W
                    </span>
                    &nbsp;{{ tag }}
                </td>
                <td class="tag-update">
                    <a href="#" class="btn tag-button">
                        Update
                    </a>
                </td>
                <td class="tag-delete">
                    <a href="#" class="btn tag-button">
                        Delete
                    </a>
                </td>
            </tr>
        {% empty %}
        {% endfor %}
    </table>
{% endblock %}
