{% extends "base.html" %}

{% block content %}
    <h1 class="heading mb-3">
        Delete task:
    </h1>
    <h3 class="heading mt-0">
        {{ task }}
    </h3>

    <div class="content">
        <h5>
            Are you sure you want to delete this task?
        </h5>

        <h2>
            
        </h2>

        <form action="" method="post">
            {% csrf_token %}
            <input type="submit" value="Delete" class="btn button-primary">
            <a class="btn button-secondary" href="{% url 'board:task-list' %}">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}
